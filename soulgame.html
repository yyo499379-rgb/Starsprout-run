<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Soul Game 原型</title>
<style>
html,body{margin:0;height:100%;background:#070a10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;image-rendering:pixelated;touch-action:none;outline:none}

#hack{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:#000;z-index:20;font-family:'Courier New',Consolas,monospace;color:#0f0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#hkw{width:960px;height:540px;position:relative;transform-origin:center center;flex:none}
#hkscreen{position:absolute;left:0;top:0;right:0;bottom:0;background:#050505;overflow:hidden;box-sizing:border-box;padding:12px 26px;text-shadow:0 0 6px rgba(0,255,0,.55)}
#hkscreen::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.30) 3px,rgba(0,0,0,.30) 4px)}
#hkscreen::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)}
#hkf{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(255,0,51,.38);opacity:0;pointer-events:none;z-index:4}
#hkscreen.flash #hkf{animation:hkflash .45s}
#hkscreen.shake{animation:hkshake .45s}
@keyframes hkflash{0%{opacity:1}100%{opacity:0}}
@keyframes hkshake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,3px)}35%{transform:translate(8px,-4px)}55%{transform:translate(-6px,2px)}75%{transform:translate(5px,-2px)}}
@keyframes hkblink{50%{opacity:.35}}
.hk-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0f0;padding-bottom:6px;font-size:22px;letter-spacing:3px}
#hkTime{font-size:30px;letter-spacing:2px}
#hkTime.warn{color:#f03;text-shadow:0 0 8px #f03}
.hk-main{display:flex;gap:22px;margin-top:10px;height:300px}
.hk-col{display:flex;flex-direction:column}
.hk-h{font-size:14px;letter-spacing:2px;color:#0c0;margin-bottom:6px}
#hkGrid{display:grid;grid-template-columns:repeat(4,100px);grid-template-rows:repeat(2,100px);gap:8px}
.hk-frag{width:100px;height:100px;box-sizing:border-box;background:#071007;border:2px solid #0f0;color:#0f0;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.hk-frag:hover{background:#0f0;color:#050505;text-shadow:none}
.hk-frag.busy{border-color:#ff0;animation:hkblink .25s infinite}
.hk-frag.locked{opacity:.3;border-style:dashed;pointer-events:none}
#hkStatus{margin-top:18px;font-size:26px;min-height:34px;letter-spacing:2px;color:#0f0}
#hkStatus.proc{color:#ff0}
#hkStatus.bad{color:#f03;text-shadow:0 0 8px #f03}
#hkTarget{width:272px;height:272px;border:2px solid #0f0;box-sizing:border-box;color:#0f0;background:#030c03}
#hkTarget svg{width:100%;height:100%;display:block}
#hkAtt{display:flex;flex-direction:column;gap:10px}
.hk-att{width:64px;height:34px;box-sizing:border-box;border:2px solid #0f0}
.hk-att.on{background:#0f0;box-shadow:0 0 8px #0f0}
.hk-att.off{border-color:#f03;opacity:.5}
.hk-bottom{margin-top:4px}
#hkSlots{display:flex;gap:16px}
.hk-slot{width:92px;height:92px;box-sizing:border-box;border:2px dashed #0a0;display:flex;align-items:center;justify-content:center;color:#0f0}
.hk-slot.full{border-style:solid;border-color:#0f0;background:#071007}
#hkResult{position:absolute;left:0;right:0;top:190px;text-align:center;font-size:80px;font-weight:bold;letter-spacing:6px;z-index:7;pointer-events:none}
#hkResult.win{color:#0f0;text-shadow:0 0 18px #0f0;background:rgba(0,24,0,.8)}
#hkResult.lose{color:#f03;text-shadow:0 0 18px #f03;background:rgba(32,0,0,.8)}
#hkExit{position:absolute;right:26px;bottom:14px;z-index:8;background:#050505;color:#0f0;border:2px solid #0f0;font:bold 16px 'Courier New',monospace;padding:6px 14px;cursor:pointer}
#hkExit:hover{background:#0f0;color:#050505}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="hack"><div id="hkw"><div id="hkscreen">
<div id="hkf"></div>
<div class="hk-top"><span>CONNECTION TIMEOUT</span><span id="hkTime">01:00:00</span></div>
<div class="hk-main">
 <div class="hk-col"><div class="hk-h">COMPONENTS</div><div id="hkGrid"></div><div id="hkStatus">AWAITING INPUT</div></div>
 <div class="hk-col"><div class="hk-h">CLONE TARGET</div><div id="hkTarget"></div></div>
 <div class="hk-col"><div class="hk-h">ACCESS ATTEMPTS</div><div id="hkAtt"></div></div>
</div>
<div class="hk-bottom"><div class="hk-h">DECIPHERED SIGNALS</div><div id="hkSlots"></div></div>
<div id="hkResult"></div>
<button id="hkExit">離開 (Esc)</button>
</div></div></div>

  const cir=(x,y,r,l)=>{ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.globalAlpha=.9;tx(l,x,y,18,'#fff','center');ctx.globalAlpha=1};

function drawSlotMachine(){const s=G.slot;R(0,0,CW,CHT,'rgba(5,8,14,.9)');R(150,50,660,440,'#14212e');R(154,54,652,432,'#0e1822');

 const zy=270,cyc=8*CELL;R(170,zy-CELL/2,620,CELL,'rgba(255,255,255,.18)');
 for(let i=0;i<5;i++){const c=s.cols[i],x=190+i*120;R(x,150,100,240,'rgba(255,255,255,.05)');

   if(y<140||y>400)continue;tx(c.L[k],x+50,y,36,k===c.g?'#4fcf7a':'#8a95a5','center')}

 if(s.fl>0){ctx.globalAlpha=s.fl;R(150,50,660,440,'#ff2a2a');ctx.globalAlpha=1}

 rows.forEach((r,i)=>{tx(r[0],360,175+i*30,18,'#9aa8b5','right');tx(r[1],380,175+i*30,18,'#fff')});
 tx('玩家',300,372,16,'#9aa8b5','center');tx('殺敵數',480,372,16,'#9aa8b5','center');tx('承受傷害',640,372,16,'#9aa8b5','center');
 G.actors.forEach((a,i)=>{tx(a.name,300,398+i*24,16,'#fff','center');tx(String(a.kills),480,398+i*24,16,'#fff','center');tx(String(a.taken),640,398+i*24,16,'#fff','center')});

function draw(){G.btns=[];ctx.imageSmoothingEnabled=false;
 if(G.screen==='title'){drawTitle();return}if(G.screen==='select'){drawSelect();return}if(G.screen==='lobby'){drawLobby();return}if(G.screen==='end'){drawEnd();return}
 if(!G.world||!G.P){R(0,0,CW,CHT,'#0b1018');tx('載入中…',CW/2,CHT/2,24,'#fff','center');return}
 drawWorld();drawHUD();
 if(G.screen==='slot')drawSlot();if(G.screen==='shop')drawShop();
 if(G.paused){R(0,0,CW,CHT,'rgba(0,0,0,.6)');tx('暫停中',CW/2,230,44,'#ffe36e','center');tx('按 P 或點擊畫面繼續',CW/2,290,20,'#fff','center')}}
function startRun(){netReset();const d=CHARS[G.sel];G.P=mk(d,false,d.n);G.actors=[G.P];G.B=null;G.Q=null;
 if(G.bot){const bs=G.sel==='nun'?'knight':'nun';G.B=mk({hp:6,sh:4,en:0,col:'#e6c46a',spr:bs,sp:140,w:'revolver',sk:{type:'none',name:'',cd:99,dur:0}},true,'AI 隊友');G.actors.push(G.B)}
 G.np=G.actors.length;G.time=600;G.gas=false;G.elapsed=0;G.tk=0;G.crun=0;G.end=null;G.paused=false;G.lastPuzzle='';buildFloor(0);G.screen='play'}
function frame(t){const dt=Math.min(.05,(t-G.last)/1000||0);G.last=t;
 try{update(dt);draw()}catch(err){console.error(err)}
 requestAnimationFrame(frame)}
requestAnimationFrame(t=>{G.last=t;frame(t)});
